{{ $home := site.Home.RelPermalink }}
{{ $prefix := cond .IsHome "" $home }}
<header class="site-header">
  <nav class="nav" aria-label="{{ i18n "menu_toggle" }}">
    <a class="brand" href="{{ if .IsHome }}#top{{ else }}{{ $home }}{{ end }}">{{ site.Params.brand }}</a>
    <ul class="nav-links">
      <li><a href="{{ $prefix }}#about">{{ i18n "nav_about" }}</a></li>
      <li><a href="{{ $prefix }}#services">{{ i18n "nav_services" }}</a></li>
      <li><a href="{{ $prefix }}#portfolio">{{ i18n "nav_portfolio" }}</a></li>
      <li><a href="{{ $prefix }}#contact">{{ i18n "nav_contact" }}</a></li>
    </ul>
    {{ range .Translations }}
    <a class="lang-switch" href="{{ .Permalink }}" hreflang="{{ .Language.Locale }}" lang="{{ .Language.Locale }}" aria-label="{{ i18n "lang_switch_label" }}">{{ .Language.Locale | upper }}</a>
    {{ end }}
  </nav>
</header>
